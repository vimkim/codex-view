<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Codex conversation</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/mathjax-config.js"></script>
  <script defer src="/mathjax/tex-svg.js"></script>
  <script defer src="/app.js"></script>
</head>
<body>
  <header>
    <div class="eyebrow">CODEX VIEW</div>
    <h1 id="title">Loading conversation…</h1>
    <p class="subtitle" id="directory">Read here. Keep chatting in your terminal.</p>
    <div class="controls">
      <span id="status" role="status" aria-live="polite">Connecting…</span>
      <label><input type="checkbox" id="progress"> Show progress updates</label>
      <label><input type="checkbox" id="follow"> Follow new messages</label>
      <button id="latest">Latest message ↓</button>
    </div>
  </header>
  <main id="messages" aria-label="Conversation"></main>
  <footer>New saved messages appear automatically. Continue the conversation in Codex CLI.</footer>
</body>
</html>
